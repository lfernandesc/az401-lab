name: lab-ci-cd
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --junitxml=results.xml --cov=app --cov-branch --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: |
            results.xml
            coverage.xml
      - run: zip app.zip app.py requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: app.zip
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: lab
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-${{ github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app.zip
      - name: Smoke test
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://${APP_NAME}.azurewebsites.net/health"
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors "https://${APP_NAME}.azurewebsites.net/orders"
